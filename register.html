<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Internship & Career Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-box">
        <div class="brand" style="justify-content: center; margin-bottom: 20px;">
          <span class="logo-mark">IC</span>
          <span>Internship & Career Guide</span>
        </div>

        <h2 class="auth-title" style="text-align: center;">Create your account</h2>
        <p style="text-align: center; margin-bottom: 24px;">Start exploring internships and careers</p>

        <form>
          <div class="form-field">
            <label>Full Name</label>
            <input class="form-control" type="text" placeholder="Enter your full name" />
          </div>

          <div class="form-field">
            <label>Email</label>
            <input class="form-control" type="email" placeholder="you@example.com" />
          </div>

          <div class="form-field">
            <label>Password</label>
            <input class="form-control" type="password" placeholder="Create a password" />
          </div>

          <div class="form-field">
            <label>Confirm Password</label>
            <input class="form-control" type="password" placeholder="Confirm your password" />
          </div>

          <div class="form-field">
            <label>University / School</label>
            <input class="form-control" type="text" placeholder="Your university or school" />
          </div>

          <div class="form-field">
            <label>Major</label>
            <input class="form-control" type="text" placeholder="Your major" />
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
        </form>

        <p style="text-align: center; margin-top: 20px; color: var(--muted);">
          Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Login</a>
        </p>
      </div>
    </div>
  </body>
</html>
